name: Build and release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag stabile corrispondente al commit della build
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.value }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      unsigned_release: ${{ steps.version.outputs.unsigned_release }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve and validate version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          UNSIGNED_UPDATE_APPROVED_TAG: ${{ vars.UNSIGNED_UPDATE_APPROVED_TAG }}
        run: |
          . .\scripts\ReleaseArtifactPolicy.ps1
          [xml]$project = Get-Content -LiteralPath '.\UpdateCenter.csproj' -Raw
          $node = $project.SelectSingleNode('/Project/PropertyGroup/Version')
          if ($null -eq $node -or $node.InnerText -notmatch '^\d+\.\d+\.\d+$') {
            throw 'UpdateCenter.csproj deve contenere Version nel formato MAJOR.MINOR.PATCH.'
          }
          $version = $node.InnerText.Trim()
          $releaseTag = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } elseif (-not [string]::IsNullOrWhiteSpace($env:RELEASE_TAG_INPUT)) {
            $env:RELEASE_TAG_INPUT
          } else {
            ''
          }
          if (-not [string]::IsNullOrWhiteSpace($releaseTag)) {
            if ($releaseTag -cnotmatch '\Av(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\z') {
              throw "Tag stabile non valido: $releaseTag"
            }
            if ($releaseTag.Substring(1) -ne $version) {
              throw "Il tag $releaseTag non coincide con la versione $version del progetto."
            }
            if ($env:RELEASE_TAG_INPUT -and $releaseTag -cne $env:RELEASE_TAG_INPUT) {
              throw 'Il tag richiesto differisce dal tag selezionato.'
            }
            $tagCommit = git rev-parse --verify "refs/tags/$releaseTag^{commit}"
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) {
              throw "Il tag $releaseTag deve esistere e puntare al commit della build."
            }
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $mode = Get-UnsignedReleaseMode $project $releaseTag $env:UNSIGNED_UPDATE_APPROVED_TAG $env:GITHUB_REPOSITORY
          $unsigned = $mode -ne 'signed'
          "unsigned_release=$($unsigned.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore .\UpdateCenter.sln -p:Configuration=Release

      - name: Build Release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          UNSIGNED_UPDATE_APPROVED_TAG: ${{ vars.UNSIGNED_UPDATE_APPROVED_TAG }}
          WINDOWS_SIGNING_CERT_SHA256: ${{ steps.version.outputs.release_tag != '' && steps.version.outputs.unsigned_release != 'true' && vars.WINDOWS_SIGNING_CERT_SHA256 || '' }}
        run: dotnet build .\UpdateCenter.sln --configuration Release --no-restore

      - name: Run Network Core tests
        shell: pwsh
        run: dotnet run --project .\Tests\UpdateCenter.NetworkCoreTests --configuration Release --no-build --no-restore

      - name: Run release audit
        shell: pwsh
        run: dotnet run --project .\Tests\UpdateCenter.SmokeTests --configuration Release --no-build --no-restore -- --release-audit

      - name: Run updater smoke tests
        shell: pwsh
        run: dotnet run --project .\Tests\UpdateCenter.SmokeTests --configuration Release --no-build --no-restore

      - name: Check app update detection
        shell: pwsh
        run: dotnet run --project .\Tests\UpdateCenter.SmokeTests --configuration Release --no-build --no-restore -- --app-update-detection

      - name: Run build output safety fixtures
        shell: pwsh
        run: .\Tests\BuildOutputPaths.Tests.ps1

      - name: Check unsigned Setup metadata policy offline
        shell: powershell
        run: .\Tests\UnsignedSetupRelease.Tests.ps1

      - name: Check release approval and assets offline
        shell: pwsh
        run: .\Tests\UnsignedWorkflow.Tests.ps1

      - name: Publish self-contained single-file
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          UNSIGNED_UPDATE_APPROVED_TAG: ${{ vars.UNSIGNED_UPDATE_APPROVED_TAG }}
          WINDOWS_SIGNING_CERT_SHA256: ${{ steps.version.outputs.release_tag != '' && steps.version.outputs.unsigned_release != 'true' && vars.WINDOWS_SIGNING_CERT_SHA256 || '' }}
        run: .\build.ps1

      - name: Sign portable executable
        if: steps.version.outputs.unsigned_release != 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          WINDOWS_SIGNING_PFX_BASE64: ${{ steps.version.outputs.release_tag != '' && secrets.WINDOWS_SIGNING_PFX_BASE64 || '' }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ steps.version.outputs.release_tag != '' && secrets.WINDOWS_SIGNING_PFX_PASSWORD || '' }}
          WINDOWS_SIGNING_CERT_SHA256: ${{ steps.version.outputs.release_tag != '' && vars.WINDOWS_SIGNING_CERT_SHA256 || '' }}
        run: .\sign-windows-artifact.ps1 -Path '.\dist\UpdateCenter.exe' -AllowUnsignedDevelopment:(!$env:RELEASE_TAG)

      - name: Prepare verified Inno Setup 7.1.1 portable
        id: inno
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolRoot = Join-Path $env:RUNNER_TEMP ('inno-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $toolRoot | Out-Null
          $package = Join-Path $toolRoot 'innosetup-7.1.1-x64.exe'
          $compilerDirectory = Join-Path $toolRoot 'compiler'
          # Digest and publisher verified against the official immutable is-7_1_1 release.
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $package
          if ((Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash -cne '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0') {
            throw 'SHA-256 del distributivo Inno Setup inatteso.'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $package
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.TimeStamperCertificate -or
              $signature.SignerCertificate.Subject -cne 'CN=Pyrsys B.V., O=Pyrsys B.V., S=Noord-Holland, C=NL') {
            throw 'Firma o timestamp del distributivo Inno Setup non attendibile.'
          }
          $arguments = @('/PORTABLE=1', '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES',
            '/NORESTART', '/NOICONS', '/NOCLOSEAPPLICATIONS', '/NORESTARTAPPLICATIONS',
            ('/DIR="' + $compilerDirectory + '"'))
          $process = Start-Process -FilePath $package -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Preparazione Inno Setup fallita ($($process.ExitCode))." }
          $compiler = Join-Path $compilerDirectory 'ISCC.exe'
          if ((Get-FileHash -LiteralPath $compiler -Algorithm SHA256).Hash -cne 'E0F9F1DC32032650C6629F6DEE41EB6D20BA140E4E3C07C25D8A24F9BA781644') {
            throw 'SHA-256 del compilatore Inno Setup inatteso.'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $compiler
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.TimeStamperCertificate -or
              $signature.SignerCertificate.Subject -cne 'CN=Pyrsys B.V., O=Pyrsys B.V., S=Noord-Holland, C=NL') {
            throw 'Firma o timestamp del compilatore Inno Setup non attendibile.'
          }
          # ISCC retains its built-in signature verification of compiler components.
          "compiler=$compiler" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build installer
        shell: pwsh
        env:
          INNO_COMPILER: ${{ steps.inno.outputs.compiler }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          UNSIGNED_UPDATE_APPROVED_TAG: ${{ vars.UNSIGNED_UPDATE_APPROVED_TAG }}
          WINDOWS_SIGNING_CERT_SHA256: ${{ steps.version.outputs.release_tag != '' && steps.version.outputs.unsigned_release != 'true' && vars.WINDOWS_SIGNING_CERT_SHA256 || '' }}
        run: .\build-installer.ps1 -NoAppBuild -SkipChecksum -InnoCompilerPath $env:INNO_COMPILER

      - name: Sign installer
        if: steps.version.outputs.unsigned_release != 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          WINDOWS_SIGNING_PFX_BASE64: ${{ steps.version.outputs.release_tag != '' && secrets.WINDOWS_SIGNING_PFX_BASE64 || '' }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ steps.version.outputs.release_tag != '' && secrets.WINDOWS_SIGNING_PFX_PASSWORD || '' }}
          WINDOWS_SIGNING_CERT_SHA256: ${{ steps.version.outputs.release_tag != '' && vars.WINDOWS_SIGNING_CERT_SHA256 || '' }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: .\sign-windows-artifact.ps1 -Path ".\installer-dist\UpdateCenter-Setup-v$env:RELEASE_VERSION.exe" -AllowUnsignedDevelopment:(!$env:RELEASE_TAG)

      - name: Create and verify release artifacts
        id: package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          WINDOWS_SIGNING_CERT_SHA256: ${{ vars.WINDOWS_SIGNING_CERT_SHA256 }}
          UNSIGNED_RELEASE: ${{ steps.version.outputs.unsigned_release }}
          UNSIGNED_UPDATE_APPROVED_TAG: ${{ vars.UNSIGNED_UPDATE_APPROVED_TAG }}
        run: |
          . .\scripts\ReleaseArtifactPolicy.ps1
          $mode = Get-VerifiedArtifactMode ([xml](Get-Content -LiteralPath '.\UpdateCenter.csproj' -Raw))
          $artifacts = Join-Path $env:RUNNER_TEMP ("update-center-release-" + [guid]::NewGuid().ToString('N'))
          New-Item -Path $artifacts -ItemType Directory | Out-Null

          $setupName = "UpdateCenter-Setup-v$env:RELEASE_VERSION.exe"
          $portableName = "UpdateCenter-v$env:RELEASE_VERSION-Portable.exe"
          $setupChecksumName = "$setupName.sha256"
          $portableChecksumName = "$portableName.sha256"
          $setupPath = Join-Path $artifacts $setupName
          $portablePath = Join-Path $artifacts $portableName
          $setupChecksumPath = Join-Path $artifacts $setupChecksumName
          $portableChecksumPath = Join-Path $artifacts $portableChecksumName
          Copy-Item -LiteralPath ".\installer-dist\$setupName" -Destination $setupPath
          Copy-Item -LiteralPath '.\dist\UpdateCenter.exe' -Destination $portablePath

          $releaseAssets = @(
            [pscustomobject]@{ Path = $setupPath; Name = $setupName; ChecksumPath = $setupChecksumPath; ChecksumName = $setupChecksumName },
            [pscustomobject]@{ Path = $portablePath; Name = $portableName; ChecksumPath = $portableChecksumPath; ChecksumName = $portableChecksumName }
          )
          foreach ($asset in $releaseAssets) {
            if ($mode -ne 'signed') {
              if ((Get-AuthenticodeSignature -LiteralPath $asset.Path).Status -ne 'NotSigned') {
                throw "Artefatto inatteso per la policy unsigned $env:RELEASE_VERSION ($($asset.Name))."
              }
            } elseif ($env:RELEASE_TAG) { .\sign-windows-artifact.ps1 -Path $asset.Path -VerifyOnly }
            $hash = (Get-FileHash -LiteralPath $asset.Path -Algorithm SHA256).Hash
            Set-Content -LiteralPath $asset.ChecksumPath -Value "$hash  $($asset.Name)" -Encoding ascii
          }

          if ($mode -ceq 'approved') {
            New-UnsignedUpdateManifest $artifacts $env:RELEASE_VERSION
          }
          Confirm-ReleaseAssets $artifacts $env:RELEASE_VERSION $mode

          $portableVersionInfo = (Get-Item -LiteralPath $portablePath).VersionInfo
          if ($portableVersionInfo.ProductVersion.Trim() -ne $env:RELEASE_VERSION) {
            throw "ProductVersion inattesa per ${portableName}: $($portableVersionInfo.ProductVersion)"
          }
          if ($portableVersionInfo.FileVersion.Trim() -ne "$env:RELEASE_VERSION.0") {
            throw "FileVersion inattesa per ${portableName}: $($portableVersionInfo.FileVersion)"
          }
          foreach ($assetPath in @($setupPath)) {
            $info = (Get-Item -LiteralPath $assetPath).VersionInfo
            if ($info.ProductVersion.Trim() -ne $env:RELEASE_VERSION -or $info.FileVersion.Trim() -ne "$env:RELEASE_VERSION.0") {
              throw "Versione Setup inattesa per $(Split-Path -Leaf $assetPath)."
            }
          }
          if (@(Get-ChildItem -LiteralPath $artifacts -File -Filter '*.bat').Count -ne 0) {
            throw 'Gli artefatti pubblicabili non devono contenere installer o disinstaller BAT.'
          }
          "directory=$artifacts" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v7
        with:
          name: UpdateCenter-v${{ steps.version.outputs.value }}
          path: ${{ steps.package.outputs.directory }}\*
          if-no-files-found: error
          retention-days: 30

  release:
    if: needs.build.outputs.release_tag != ''
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout signature verifier at build commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download verified artifacts
        uses: actions/download-artifact@v8
        with:
          name: UpdateCenter-v${{ needs.build.outputs.version }}
          path: artifacts

      - name: Create stable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          ASSET_DIRECTORY: artifacts
          WINDOWS_SIGNING_CERT_SHA256: ${{ vars.WINDOWS_SIGNING_CERT_SHA256 }}
          UNSIGNED_RELEASE: ${{ needs.build.outputs.unsigned_release }}
          UNSIGNED_UPDATE_APPROVED_TAG: ${{ vars.UNSIGNED_UPDATE_APPROVED_TAG }}
        run: |
          . .\scripts\ReleaseArtifactPolicy.ps1
          $mode = Get-VerifiedArtifactMode ([xml](Get-Content -LiteralPath '.\UpdateCenter.csproj' -Raw))
          Confirm-ReleaseAssets $env:ASSET_DIRECTORY $env:RELEASE_VERSION $mode
          $assets = @(Get-ChildItem -LiteralPath $env:ASSET_DIRECTORY -File | ForEach-Object { $_.FullName })
          foreach ($path in ($assets | Where-Object { $_ -like '*.exe' })) {
            if ($mode -ne 'signed') {
              if ((Get-AuthenticodeSignature -LiteralPath $path).Status -ne 'NotSigned') {
                throw "Artefatto inatteso per la policy unsigned $env:RELEASE_VERSION ($path)."
              }
            } else { .\sign-windows-artifact.ps1 -Path $path -VerifyOnly }
          }
          $tagRef = "refs/tags/$env:RELEASE_TAG"
          $remote = @(git ls-remote --exit-code --tags origin $tagRef ($tagRef + '^{}'))
          if ($LASTEXITCODE -ne 0) { throw 'Tag pubblico non verificabile prima della pubblicazione.' }
          $direct = @($remote | Where-Object { $_ -clike "*$([char]9)$tagRef" })
          $peeled = @($remote | Where-Object { $_ -clike "*$([char]9)$tagRef^{}" })
          if ($direct.Count -ne 1 -or $peeled.Count -gt 1 -or $remote.Count -ne ($direct.Count + $peeled.Count)) {
            throw 'Risposta ambigua per il riferimento del tag pubblico.'
          }
          $tagCommit = if ($peeled.Count) { $peeled[0].Split([char]9)[0] } else { $direct[0].Split([char]9)[0] }
          if ($tagCommit -cne $env:GITHUB_SHA) {
            throw 'Il tag pubblico deve ancora puntare al commit verificato dalla build.'
          }
          $notesPath = Join-Path 'docs' "RELEASE-$env:RELEASE_VERSION.md"
          if (Test-Path -LiteralPath $notesPath -PathType Leaf) {
            if ([string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $notesPath -Raw))) {
              throw "Il file delle note è vuoto: $notesPath"
            }
            $notesArgs = @('--notes-file', $notesPath)
          } elseif ($env:RELEASE_TAG -cin @('v2.0.0', 'v2.0.1')) {
            throw "Mancano le note di rilascio: $notesPath"
          } else {
            $notesArgs = @('--generate-notes')
          }
          # Create once. Concurrent or repeated release attempts cannot replace uploaded assets.
          gh release create $env:RELEASE_TAG $assets `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "UpdateCenter $env:RELEASE_VERSION" `
            @notesArgs `
            --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "Creazione della Release GitHub non riuscita (exit code $LASTEXITCODE)." }
