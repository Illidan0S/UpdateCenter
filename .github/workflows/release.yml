name: Build and release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag di Release esistente da aggiornare (ad esempio v1.1.4)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.value }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Configure .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Resolve and validate version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          [xml]$project = Get-Content -LiteralPath '.\UpdateCenter.csproj' -Raw
          $node = $project.SelectSingleNode('/Project/PropertyGroup/Version')
          if ($null -eq $node -or $node.InnerText -notmatch '^\d+\.\d+\.\d+$') {
            throw 'UpdateCenter.csproj deve contenere Version nel formato MAJOR.MINOR.PATCH.'
          }
          $version = $node.InnerText.Trim()
          $releaseTag = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } elseif (-not [string]::IsNullOrWhiteSpace($env:RELEASE_TAG_INPUT)) {
            $env:RELEASE_TAG_INPUT.Trim()
          } else {
            ''
          }
          if (-not [string]::IsNullOrWhiteSpace($releaseTag)) {
            if ($releaseTag -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Tag stabile non valido: $releaseTag"
            }
            if ($releaseTag.Substring(1) -ne $version) {
              throw "Il tag $releaseTag non coincide con la versione $version del progetto."
            }
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore dependencies
        shell: pwsh
        run: |
          dotnet restore .\UpdateCenter.csproj --runtime win-x64
          dotnet restore .\Tests\UpdateCenter.SmokeTests\UpdateCenter.SmokeTests.csproj --runtime win-x64

      - name: Build Release
        shell: pwsh
        run: dotnet build .\UpdateCenter.csproj --configuration Release --runtime win-x64 --no-restore

      - name: Run updater smoke tests
        shell: pwsh
        run: dotnet run --project .\Tests\UpdateCenter.SmokeTests\UpdateCenter.SmokeTests.csproj --configuration Release --runtime win-x64 --no-restore

      - name: Publish self-contained single-file
        shell: pwsh
        run: .\build.ps1 -NoRestore

      - name: Sign portable executable
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: .\sign-windows-artifact.ps1 -Path '.\dist\UpdateCenter.exe'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: .\build-installer.ps1 -NoAppBuild

      - name: Sign installer
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: .\sign-windows-artifact.ps1 -Path ".\installer-dist\UpdateCenter-Setup-v$env:RELEASE_VERSION.exe"

      - name: Create and verify release artifacts
        id: package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'update-center-release'
          $artifacts = Join-Path $releaseRoot 'artifacts'
          if (Test-Path -LiteralPath $releaseRoot) {
            Remove-Item -LiteralPath $releaseRoot -Recurse -Force
          }
          New-Item -Path $artifacts -ItemType Directory -Force | Out-Null

          $installerSourceName = "UpdateCenter-Setup-v$env:RELEASE_VERSION.exe"
          $setupName = "UpdateCenter-$env:RELEASE_VERSION-setup.exe"
          $portableName = "UpdateCenter-$env:RELEASE_VERSION-portable.exe"
          $checksumName = "UpdateCenter-$env:RELEASE_VERSION-SHA256.txt"
          $setupPath = Join-Path $artifacts $setupName
          $portablePath = Join-Path $artifacts $portableName
          $checksumPath = Join-Path $artifacts $checksumName
          Copy-Item -LiteralPath ".\installer-dist\$installerSourceName" -Destination $setupPath
          Copy-Item -LiteralPath '.\dist\UpdateCenter.exe' -Destination $portablePath

          $checksumLines = foreach ($asset in @(@($portablePath, $portableName), @($setupPath, $setupName))) {
            $hash = (Get-FileHash -LiteralPath $asset[0] -Algorithm SHA256).Hash
            "$hash  $($asset[1])"
          }
          Set-Content -LiteralPath $checksumPath -Value $checksumLines -Encoding ascii

          foreach ($asset in @(@($portablePath, $portableName), @($setupPath, $setupName))) {
            $hash = (Get-FileHash -LiteralPath $asset[0] -Algorithm SHA256).Hash
            $publishedHash = ([regex]::Match((Get-Content -LiteralPath $checksumPath -Raw), "(?m)^([0-9A-Fa-f]{64})  $([regex]::Escape($asset[1]))$")).Groups[1].Value
            if ($publishedHash -ne $hash) {
              throw "Verifica SHA-256 non riuscita per $($asset[1])."
            }
          }

          $portableVersionInfo = (Get-Item -LiteralPath $portablePath).VersionInfo
          if ($portableVersionInfo.ProductVersion.Trim() -ne $env:RELEASE_VERSION) {
            throw "ProductVersion inattesa per $portableName: $($portableVersionInfo.ProductVersion)"
          }
          if ($portableVersionInfo.FileVersion.Trim() -ne "$env:RELEASE_VERSION.0") {
            throw "FileVersion inattesa per $portableName: $($portableVersionInfo.FileVersion)"
          }
          foreach ($assetPath in @($setupPath)) {
            $assetVersion = (Get-Item -LiteralPath $assetPath).VersionInfo.ProductVersion.Trim()
            if ($assetVersion -ne $env:RELEASE_VERSION) {
              throw "Versione EXE inattesa per $(Split-Path -Leaf $assetPath): $assetVersion"
            }
          }
          if (@(Get-ChildItem -LiteralPath $artifacts -File -Filter '*.bat').Count -ne 0) {
            throw 'Gli artefatti pubblicabili non devono contenere installer o disinstaller BAT.'
          }
          "directory=$artifacts" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v7
        with:
          name: UpdateCenter-v${{ steps.version.outputs.value }}
          path: ${{ steps.package.outputs.directory }}\*
          if-no-files-found: error
          retention-days: 30

  release:
    if: needs.build.outputs.release_tag != ''
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v8
        with:
          name: UpdateCenter-v${{ needs.build.outputs.version }}
          path: artifacts

      - name: Create stable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          ASSET_DIRECTORY: artifacts
        run: |
          $assets = @(Get-ChildItem -LiteralPath $env:ASSET_DIRECTORY -File | ForEach-Object { $_.FullName })
          $expectedAssets = @(
            "UpdateCenter-$env:RELEASE_VERSION-portable.exe",
            "UpdateCenter-$env:RELEASE_VERSION-setup.exe",
            "UpdateCenter-$env:RELEASE_VERSION-SHA256.txt"
          )
          if ($assets.Count -ne $expectedAssets.Count -or
              @($expectedAssets | Where-Object { -not (Test-Path -LiteralPath (Join-Path $env:ASSET_DIRECTORY $_)) }).Count -ne 0) {
            throw "Asset di Release inattesi o mancanti per la versione $env:RELEASE_VERSION."
          }
          if (gh release view $env:RELEASE_TAG --repo "$env:GITHUB_REPOSITORY" 2>$null) {
            gh release upload $env:RELEASE_TAG $assets --repo "$env:GITHUB_REPOSITORY" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Caricamento degli asset di Release non riuscito (exit code $LASTEXITCODE)." }
          } else {
            gh release create $env:RELEASE_TAG $assets `
              --repo "$env:GITHUB_REPOSITORY" `
              --title "UpdateCenter $env:RELEASE_VERSION" `
              --generate-notes `
              --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "Creazione della Release GitHub non riuscita (exit code $LASTEXITCODE)." }
          }
